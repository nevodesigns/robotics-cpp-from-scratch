name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The toolchain matrix is generated from platforms.json by the repository's own
  # tool, so a lane and a lesson's platform claim cannot drift apart. Rule L019
  # checks the same file from the other direction.
  setup:
    name: toolchains
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.derive.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: build the tool
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          cmake -S . -B build -G Ninja -DRC_BUILD_LESSONS=OFF
          cmake --build build --target rcpp
      - id: derive
        run: echo "matrix=$(./build/bin/rcpp platforms --matrix)" >> "$GITHUB_OUTPUT"

  # The contract lane is fast and blocking. It runs the same auditor a
  # contributor runs locally, so a failure here is never a surprise.
  contract:
    name: contract
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: build the tool
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          cmake -S . -B build -G Ninja -DRC_BUILD_LESSONS=OFF
          cmake --build build --target rcpp
      - name: audit the lesson contract
        run: ./build/bin/rcpp audit
      - name: the README counts match the repository
        run: ./build/bin/rcpp readme
      - name: publish the catalog
        run: ./build/bin/rcpp catalog --stdout > catalog.json
      - uses: actions/upload-artifact@v4
        with:
          name: catalog
          path: catalog.json

  # Every reference implementation must build and pass on every toolchain the
  # lessons claim. This is the number the README reports.
  build:
    name: ${{ matrix.name }}
    needs: setup
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: install the toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ${{ matrix.cxx }}
      - name: install Qt from apt
        if: runner.os == 'Linux' && matrix.qt
        # libgl1-mesa-dev is not optional. Qt6 Widgets depends on Qt6 Gui, which
        # needs OpenGL development files, and qt6-base-dev does not pull them in
        # on Ubuntu 22.04. Without it find_package reports Qt6 as missing.
        run: sudo apt-get install -y qt6-base-dev libgl1-mesa-dev

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - name: configure
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DRC_PLATFORM_ID=${{ matrix.platform_id }}
          -DRC_STRICT_CLAIMS=ON

      - name: build every reference implementation
        run: cmake --build build

      - name: run the gate
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build -L reference --output-on-failure

      - name: report what was proven
        shell: bash
        run: |
          count=$(ctest --test-dir build -L reference -N | grep -c "Test *#" || true)
          echo "::notice::${{ matrix.platform_id }} built and passed ${count} lesson reference suites"

  # Undefined behaviour and memory errors are exactly the class of bug this
  # curriculum teaches people to find, so the repository has to be clean of them.
  sanitize:
    name: sanitizers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build qt6-base-dev libgl1-mesa-dev
      - name: configure with address and undefined behaviour sanitizers
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DRC_SANITIZE_ADDRESS=ON
      - run: cmake --build build
      - name: run the gate under the sanitizers
        env:
          QT_QPA_PLATFORM: offscreen
          ASAN_OPTIONS: detect_leaks=1
        run: ctest --test-dir build -L reference --output-on-failure

  # A learner's exercise is allowed to fail, but never to crash. A segmentation
  # fault teaches nothing, so every exercise must exit with a readable report.
  exercises-fail-cleanly:
    name: exercises fail cleanly
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build qt6-base-dev libgl1-mesa-dev
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
      - name: build the tool, which supplies the target list
        run: cmake --build build --target rcpp
      - name: every exercise that compiles must fail with a report, not a crash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          status=0
          for target in $(./build/bin/rcpp targets --exercises); do
            if ! cmake --build build --target "$target" > /dev/null 2>&1; then
              echo "skip $target, it does not compile on purpose"
              continue
            fi
            binary=$(find build -name "$target" -type f -perm -u+x | head -1)
            [ -z "$binary" ] && continue
            "$binary" > /dev/null 2>&1
            code=$?
            # 0 means the shipped exercise already passes, which is a bug in the
            # lesson. Anything above 128 is a signal, which means it crashed.
            if [ "$code" -eq 0 ]; then
              echo "::error::$target passes as shipped, so it teaches nothing"
              status=1
            elif [ "$code" -gt 128 ]; then
              echo "::error::$target crashed with signal $((code - 128)) instead of reporting a failure"
              status=1
            else
              echo "ok $target failed cleanly with exit $code"
            fi
          done
          exit $status
